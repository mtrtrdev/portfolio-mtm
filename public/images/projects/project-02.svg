<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0c0d10"/>
  <defs>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#grid2)" />
  
  <!-- Modern Dashboard Elements Mock -->
  <rect x="150" y="120" width="500" height="260" rx="4" fill="#14151b" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <rect x="150" y="120" width="500" height="35" rx="4" fill="#1b1c24" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <circle cx="170" cy="137" r="4" fill="#ef4444"/>
  <circle cx="185" cy="137" r="4" fill="#facc15"/>
  <circle cx="200" cy="137" r="4" fill="#22c55e"/>
  
  <!-- Command palette / search bar simulation -->
  <rect x="240" y="127" width="320" height="20" rx="3" fill="#09090b" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="250" y="141" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="10">⌘K Search workflows, pipelines, PRs...</text>

  <!-- Content cards -->
  <rect x="180" y="180" width="200" height="80" rx="2" fill="#181920" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="400" y="180" width="220" height="80" rx="2" fill="#181920" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="180" y="280" width="440" height="70" rx="2" fill="#181920" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <line x1="200" y1="205" x2="350" y2="205" stroke="#facc15" stroke-width="2"/>
  <line x1="200" y1="225" x2="300" y2="225" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

  <!-- Editorial Typography -->
  <text x="50" y="80" fill="#ffffff" font-family="'Courier New', monospace" font-size="12" letter-spacing="4">PROJECT.02 // ARCHITECTURE</text>
  <text x="50" y="440" fill="#fafafa" font-family="'Times New Roman', serif" font-size="28">Nexus Workflow Engine</text>
  <text x="750" y="440" text-anchor="end" fill="#facc15" font-family="'Courier New', monospace" font-size="12">OPTIMISTIC UI // SSE</text>
</svg>

