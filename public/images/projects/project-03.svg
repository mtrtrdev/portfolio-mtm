<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#09090b"/>
  <defs>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="50%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
  </defs>

  <!-- Abstract UI Components Floating -->
  <g transform="translate(180, 140)">
    <!-- Switch component -->
    <rect x="20" y="30" width="120" height="50" rx="25" fill="#18181b" stroke="#facc15" stroke-width="1.5"/>
    <circle cx="115" cy="55" r="18" fill="#facc15"/>

    <!-- Sliders -->
    <line x1="180" y1="55" x2="380" y2="55" stroke="rgba(255,255,255,0.2)" stroke-width="4" stroke-linecap="round"/>
    <line x1="180" y1="55" x2="290" y2="55" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="290" cy="55" r="9" fill="#ffffff"/>

    <!-- Badge stack -->
    <rect x="20" y="110" width="110" height="32" rx="2" fill="none" stroke="#facc15" stroke-width="1"/>
    <text x="75" y="130" text-anchor="middle" fill="#facc15" font-family="monospace" font-size="11">INTERACTION</text>

    <rect x="150" y="110" width="110" height="32" rx="2" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <text x="205" y="130" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">ACCESSIBLE</text>

    <!-- Stepper line -->
    <path d="M 20 180 Q 150 240 380 170" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-dasharray="6 4"/>
  </g>

  <!-- Editorial Typography -->
  <text x="50" y="80" fill="#ffffff" font-family="'Courier New', monospace" font-size="12" letter-spacing="4">PROJECT.03 // DESIGN SYSTEM</text>
  <text x="50" y="440" fill="#facc15" font-family="'Times New Roman', serif" font-style="italic" font-size="28">Kinetic UI Lab</text>
  <text x="750" y="440" text-anchor="end" fill="rgba(255,255,255,0.4)" font-family="'Courier New', monospace" font-size="12">WCAG 2.1 AA // MICRO-MOTION</text>
</svg>

