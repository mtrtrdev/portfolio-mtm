<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#09090b"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#grid)" />
  <circle cx="400" cy="250" r="180" fill="url(#glow)"/>
  
  <!-- Geometric wireframe shapes -->
  <polygon points="400,100 550,350 250,350" fill="none" stroke="#facc15" stroke-width="1.5" stroke-dasharray="4 2"/>
  <circle cx="400" cy="250" r="120" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <circle cx="400" cy="250" r="60" fill="none" stroke="#facc15" stroke-width="2"/>
  
  <!-- Editorial Typography -->
  <text x="50" y="80" fill="#ffffff" font-family="'Courier New', monospace" font-size="12" letter-spacing="4">PROJECT.01 // WEBGL ENGINE</text>
  <text x="50" y="440" fill="#facc15" font-family="'Times New Roman', serif" font-style="italic" font-size="28">Aura Spatial Canvas</text>
  <text x="750" y="440" text-anchor="end" fill="rgba(255,255,255,0.4)" font-family="'Courier New', monospace" font-size="12">100K PARTICLES // 60FPS</text>
</svg>

